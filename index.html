<!DOCTYPE html>
<html lang="is">
<head>

    <style>

            box-sizing: border-box;
        }
        .container { 
            width: 100%;

            background: white;

            max-height: 100%;

        }

            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */

            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;

            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;

            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px;

            color: #555;

            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

            "ar": "<div dir='rtl'><b>الشرح:</b> (اسم إشارة) يشير إلى شيء محدد قريب، في حالة الجر (هذا/هؤلاء).<br><b>مثال:</b> أنا في <b>هذا</b> المدرسة.</div>",
            "be": "<b>Uitleg:</b> (Aanwijzend voornaamwoord) Wijst naar iets specifieks in de buurt, in de datief.<br><b>Voorbeeld:</b> Ik zit op <b>deze</b> school.",
            "da": "<b>Forklaring:</b> (Påpegende stedord) Henviser til noget bestemt, der er tæt på, i dativ (dette/disse).<br><b>Eksempel:</b> Jeg går på <b>denne</b> skole.",
            "en": "<b>Explanation:</b> (Demonstrative pronoun) Points to a specific thing that is nearby, in the dative case (this/these).<br><b>Example:</b> I am in <b>this</b> school.",
            "tl": "<b>Paliwanag:</b> (Panghalip pamatlig) Tumuturo sa isang tiyak na bagay na malapit, sa dative case (ito).<br><b>Halimbawa:</b> Ako ay nasa paaralang <b>ito</b>.",
            "fi": "<b>Selitys:</b> (Osoittava pronomini) Viittaa tiettyyn lähellä olevaan asiaan datiivissa (tämä).<br><b>Esimerkki:</b> Olen <b>tässä</b> koulussa.",
            "fr": "<b>Explication:</b> (Pronom démonstratif) Désigne une chose spécifique à proximité, au datif (ce/cet).<br><b>Exemple:</b> Je suis dans <b>cette</b> école.",
            "fo": "<b>Frágreiðing:</b> (Ávísingarfornavn) Vísir á okkurt ávíst ið er nær, í hvørjumfalli.<br><b>Dømi:</b> Eg gangi í <b>hesum</b> skúla.",
            "kl": "<b>Nassoqqaat:</b> (Fornavn) Una / matumani.<br><b>Assersuut:</b> Atuarfimmi <b>matumani</b>ippunga.",
            "zh": "<b>解释:</b> (指示代词) 指向附近特定的事物，与格形式（这/这些）。<br><b>例句:</b> 我在<b>这所</b>学校。",
            "lv": "<b>Paskaidrojums:</b> (Norādāmais vietniekvārds) Norāda uz kaut ko konkrētu tuvumā, datīvā (šajā).<br><b>Piemērs:</b> Es mācos <b>šajā</b> skolā.",
            "lt": "<b>Paaiškinimas:</b> (Parodomasis įvardis) Nurodo konkretų daiktą netoliese, naudininke (šiam/šioje).<br><b>Pavyzdys:</b> Aš mokausi <b>šioje</b> mokykloje.",
            "no": "<b>Forklaring:</b> (Påpekende pronomen) Viser til noe bestemt som er nær, i dativ (denne).<br><b>Eksempel:</b> Jeg går på <b>denne</b> skolen.",
            "fa": "<div dir='rtl'><b>توضیح:</b> (ضمیر اشاره) به چیز خاصی که نزدیک است اشاره می‌کند، در حالت مفعولی باواسطه (این).<br><b>مثال:</b> من در <b>این</b> مدرسه هستم.</div>",
            "pt": "<b>Explicação:</b> (Pronome demonstrativo) Aponta para uma coisa específica próxima, no caso dativo (este/esta).<br><b>Exemplo:</b> Eu estou <b>nesta</b> escola.",
            "pl": "<b>Wyjaśnienie:</b> (Zaimek wskazujący) Wskazuje na konkretną rzecz w pobliżu, w celowniku (tym/tej).<br><b>Przykład:</b> Jestem w <b>tej</b> szkole.",
            "ro": "<b>Explicație:</b> (Pronume demonstrativ) Indică un lucru specific din apropiere, în cazul dativ (acest).<br><b>Exemplu:</b> Eu sunt la <b>această</b> școală.",
            "ru": "<b>Объяснение:</b> (Указательное местоимение) Указывает на конкретную вещь поблизости, в дательном падеже (этом/этой).<br><b>Пример:</b> Я учусь в <b>этой</b> школе.",
            "es": "<b>Explicación:</b> (Pronombre demostrativo) Señala una cosa específica cercana, en caso dativo (este/esta).<br><b>Ejemplo:</b> Yo estoy en <b>esta</b> escuela.",
            "sv": "<b>Förklaring:</b> (Demonstrativt pronomen) Pekar på något specifikt som är nära, i dativ (denna/detta).<br><b>Exempel:</b> Jag går i <b>den här</b> skolan.",
            "th": "<b>คำอธิบาย:</b> (สรรพนามชี้เฉพาะ) ชี้ไปยังสิ่งที่อยู่ใกล้เคียงแบบเฉพาะเจาะจง ในรูปรองกรรม (นี้/เหล่านี้)<br><b>ตัวอย่าง:</b> ฉันอยู่ในโรงเรียน<b>นี้</b>",
            "de": "<b>Erklärung:</b> (Demonstrativpronomen) Weist auf eine bestimmte Sache in der Nähe hin, im Dativ (diesem/diesen).<br><b>Beispiel:</b> Ich bin in <b>dieser</b> Schule.",
            "uk": "<b>Пояснення:</b> (Вказівний займенник) Вказує на конкретну річ поблизу, у давальному відмінку (цій/цьому).<br><b>Приклад:</b> Я навчаюся в <b>цій</b> школі.",
            "vi": "<b>Giải thích:</b> (Đại từ chỉ định) Chỉ một vật cụ thể ở gần, trong cách tặng (này).<br><b>Ví dụ:</b> Tôi học ở ngôi trường <b>này</b>."
        }
    },
    { 
        text: "maður",

        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b><br>1. (اسم) إنسان ذكر أو فتى بالغ (رجل).<br>2. (ضمير نكرة) الناس بشكل عام (المرء).<br><b>مثال 1:</b> هذا <b>الرجل</b> هو معلمي.<br><b>مثال 2:</b> كيف يفعل <b>المرء</b> هذا؟</div>",
            "be": "<b>Uitleg:</b><br>1. (Zelfstandig naamwoord) Een volwassen man.<br>2. (Onbepaald voornaamwoord) Mensen in het algemeen (men).<br><b>Voorbeeld 1:</b> Deze <b>man</b> is mijn leraar.<br><b>Voorbeeld 2:</b> Hoe doet <b>men</b> dit?",
            "da": "<b>Forklaring:</b><br>1. (Navneord) Hankøns menneske eller voksen dreng (mand).<br>2. (Ubestemt stedord) Folk generelt (man).<br><b>Eksempel 1:</b> Denne <b>mand</b> er min lærer.<br><b>Eksempel 2:</b> Hvordan gør <b>man</b> det?",
            "en": "<b>Explanation:</b><br>1. (Noun) A male human or adult boy (man).<br>2. (Indefinite pronoun) People in general (one / you).<br><b>Example 1:</b> This <b>man</b> is my teacher.<br><b>Example 2:</b> How does <b>one (you)</b> do this?",
            "tl": "<b>Paliwanag:</b><br>1. (Pangngalan) Lalaking tao o nasa hustong gulang na batang lalaki (lalaki).<br>2. (Hindi tiyak na panghalip) Tao sa pangkalahatan (ang isang tao).<br><b>Halimbawa 1:</b> Ang <b>lalaki</b>ng ito ay ang aking guro.<br><b>Halimbawa 2:</b> Paano ito ginagawa ng <b>isang tao</b>?",
            "fi": "<b>Selitys:</b><br>1. (Substantiivi) Miespuolinen ihminen (mies).<br>2. (Epämääräinen pronomini) Ihmiset yleensä (yksilö / ihminen).<br><b>Esimerkki 1:</b> Tämä <b>mies</b> on opettajani.<br><b>Esimerkki 2:</b> Miten <b>tämä (yksilö)</b> tehdään?",
            "fr": "<b>Explication:</b><br>1. (Nom) Humain de sexe masculin (homme).<br>2. (Pronom indéfini) Les gens en général (on).<br><b>Exemple 1:</b> Cet <b>homme</b> est mon professeur.<br><b>Exemple 2:</b> Comment <b>on</b> fait ça ?",
            "fo": "<b>Frágreiðing:</b><br>1. (Navnorð) Kallkyns menniskja (maður).<br>2. (Óvíst fornavn) Fólk sum heild (man).<br><b>Dømi 1:</b> Hesin <b>maður</b> er lærarin hjá mær.<br><b>Dømi 2:</b> Hvussu ger <b>man</b> hetta?",
            "kl": "<b>Nassoqqaat:</b><br>1. (Navneord) Angut.<br>2. (Fornavn) Inuk.<br><b>Assersuut 1:</b> <b>Angut</b> una ilinniartitsisoraara.<br><b>Assersuut 2:</b> Qanoq iliortarpaat? (Hvernig gerir <b>maður</b> þetta?)",
            "nl": "<b>Uitleg:</b><br>1. (Zelfstandig naamwoord) Een volwassen man.<br>2. (Onbepaald voornaamwoord) Mensen in het algemeen (men).<br><b>Voorbeeld 1:</b> Deze <b>man</b> is mijn leraar.<br><b>Voorbeeld 2:</b> Hoe doet <b>men</b> dit?",
            "it": "<b>Spiegazione:</b><br>1. (Sostantivo) Un essere umano maschio (uomo).<br>2. (Pronome indefinito) Le persone in generale (si / uno).<br><b>Esempio 1:</b> Questo <b>uomo</b> è il mio insegnante.<br><b>Esempio 2:</b> Come si fa questo (come lo fa <b>uno</b>)?",
            "ja": "<b>説明:</b><br>1. (名詞) 男性の人間（男の人）。<br>2. (不定代名詞) 一般的な人々（人）。<br><b>例文 1:</b> この<b>男の人</b>は私の先生です。<br><b>例文 2:</b> <b>人</b>はこれをどうやってするの？",
            "zh": "<b>解释:</b><br>1. (名词) 男性人类或成年男孩（男人）。<br>2. (不定代词) 泛指人们（人们/一个人）。<br><b>例句 1:</b> 这个<b>男人</b>是我的老师。<br><b>例句 2:</b> <b>人们</b>怎么做这个？",
            "ku": "<b>Ravekirin:</b><br>1. (Navdêr) Mirovê nêr (mêr).<br>2. (Cînavê nediyar) Mirov bi gelemperî (mirov).<br><b>Mînak 1:</b> Ev <b>mêr</b> mamosteyê min e.<br><b>Mînak 2:</b> <b>Mirov</b> vî karî çawa dike?",
            "lv": "<b>Paskaidrojums:</b><br>1. (Lietvārds) Vīriešu dzimtes cilvēks (vīrietis).<br>2. (Nenoteiktais vietniekvārds) Cilvēki kopumā (kāds/cilvēks).<br><b>Piemērs 1:</b> Šis <b>vīrietis</b> ir mans skolotājs.<br><b>Piemērs 2:</b> Kā <b>to (cilvēks)</b> dara?",
            "lt": "<b>Paaiškinimas:</b><br>1. (Daiktavardis) Vyriškos lyties žmogus (vyras).<br>2. (Neapibrėžtasis įvardis) Žmonės apskritai (žmogus / vienas).<br><b>Pavyzdys 1:</b> Šis <b>vyras</b> yra mano mokytojas.<br><b>Pavyzdys 2:</b> Kaip <b>tai (žmogus)</b> daroma?",
            "no": "<b>Forklaring:</b><br>1. (Substantiv) En mannlig person (mann).<br>2. (Ubestemt pronomen) Folk generelt (man).<br><b>Eksempel 1:</b> Denne <b>mannen</b> er læreren min.<br><b>Eksempel 2:</b> Hvordan gjør <b>man</b> dette?",
            "fa": "<div dir='rtl'><b>توضیح:</b><br>1. (اسم) انسان مذکر (مرد).<br>2. (ضمیر نامعین) افراد به طور کلی (آدم/یک نفر).<br><b>مثال 1:</b> این <b>مرد</b> معلم من است.<br><b>مثال 2:</b> <b>آدم</b> این کار را چطور انجام می‌دهد؟</div>",
            "pt": "<b>Explicação:</b><br>1. (Substantivo) Humano do sexo masculino (homem).<br>2. (Pronome indefinido) Pessoas em geral (a gente / alguém).<br><b>Exemplo 1:</b> Este <b>homem</b> é meu professor.<br><b>Exemplo 2:</b> Como <b>se (a gente)</b> faz isso?",
            "pl": "<b>Wyjaśnienie:</b><br>1. (Rzeczownik) Płeć męska (mężczyzna).<br>2. (Zaimek nieokreślony) Ludzie ogólnie (człowiek / się).<br><b>Przykład 1:</b> Ten <b>mężczyzna</b> to mój nauczyciel.<br><b>Przykład 2:</b> Jak <b>się (człowiek)</b> to robi?",
            "ro": "<b>Explicație:</b><br>1. (Substantiv) Om de sex masculin (bărbat).<br>2. (Pronume nehotărât) Oamenii în general (se / omul).<br><b>Exemplu 1:</b> Acest <b>bărbat</b> este profesorul meu.<br><b>Exemplu 2:</b> Cum se face asta (Cum face <b>omul</b>)?",
            "ru": "<b>Объяснение:</b><br>1. (Существительное) Мужчина.<br>2. (Неопределенное местоимение) Люди в целом (человек / 'как это делают').<br><b>Пример 1:</b> Этот <b>мужчина</b> — мой учитель.<br><b>Пример 2:</b> Как <b>человек (это)</b> делает?",
            "es": "<b>Explicación:</b><br>1. (Sustantivo) Un varón humano (hombre).<br>2. (Pronombre indefinido) Personas en general (uno / se).<br><b>Ejemplo 1:</b> Este <b>hombre</b> es mi profesor.<br><b>Ejemplo 2:</b> ¿Cómo hace <b>uno</b> esto?",
            "sv": "<b>Förklaring:</b><br>1. (Substantiv) En manlig person (man).<br>2. (Obestämt pronomen) Folk i allmänhet (man).<br><b>Exempel 1:</b> Den här <b>mannen</b> är min lärare.<br><b>Exempel 2:</b> Hur gör <b>man</b> detta?",
            "th": "<b>คำอธิบาย:</b><br>1. (คำนาม) มนุษย์เพศชาย (ผู้ชาย)<br>2. (สรรพนามไม่ชี้เฉพาะ) ผู้คนโดยทั่วไป (คนเรา)<br><b>ตัวอย่าง 1:</b> <b>ผู้ชาย</b>คนนี้คือครูของฉัน<br><b>ตัวอย่าง 2:</b> <b>คนเรา</b>ทำสิ่งนี้ได้อย่างไร?",
            "de": "<b>Erklärung:</b><br>1. (Substantiv) Ein männlicher Mensch (Mann).<br>2. (Indefinitpronomen) Leute im Allgemeinen (man).<br><b>Beispiel 1:</b> Dieser <b>Mann</b> ist mein Lehrer.<br><b>Beispiel 2:</b> Wie macht <b>man</b> das?",
            "uk": "<b>Пояснення:</b><br>1. (Іменник) Чоловік.<br>2. (Неозначений займенник) Люди загалом (людина / 'як це роблять').<br><b>Приклад 1:</b> Цей <b>чоловік</b> — мій вчитель.<br><b>Приклад 2:</b> Як <b>людина (це)</b> робить?",
            "vi": "<b>Giải thích:</b><br>1. (Danh từ) Con người là nam giới (người đàn ông).<br>2. (Đại từ bất định) Mọi người nói chung (người ta).<br><b>Ví dụ 1:</b> <b>Người đàn ông</b> này là giáo viên của tôi.<br><b>Ví dụ 2:</b> <b>Người ta</b> làm điều này như thế nào?"
        }

    { 
        text: "enn", 
        is_exp: "<b>Útskýring:</b><br>1. (Atviksorð) Eitthvað sem er að gerast áfram (oft notað sem 'ennþá').<br>2. (Atviksorð) Til að stækka orð í samanburði (t.d. enn stærri).<br><br><b>Dæmi 1:</b> Ertu <b>enn</b> að læra?<br><b>Dæmi 2:</b> Hann er <b>enn</b> stærri en ég.",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b><br>1. (ظرف) شيء لا يزال يحدث (لا يزال).<br>2. (ظرف) لزيادة صفة (أكثر).<br><b>مثال 1:</b> هل ما زلت تتعلم <b>(حتى الآن)</b>؟<br><b>مثال 2:</b> إنه <b>أكثر (حتى)</b> ضخامة مني.</div>",
            "be": "<b>Uitleg:</b><br>1. (Bijwoord) Iets dat nog steeds gebeurt (nog steeds).<br>2. (Bijwoord) Om een vergrotende trap te versterken (nog groter).<br><b>Voorbeeld 1:</b> Ben je <b>nog steeds</b> aan het leren?<br><b>Voorbeeld 2:</b> Hij is <b>nog</b> groter dan ik.",
            "da": "<b>Forklaring:</b><br>1. (Biord) Noget der stadig sker (endnu/stadig).<br>2. (Biord) Til at forstærke et ord i sammenligning (endnu større).<br><b>Eksempel 1:</b> Lærer du <b>stadig</b>?<br><b>Eksempel 2:</b> Han er <b>endnu</b> større end mig.",
            "en": "<b>Explanation:</b><br>1. (Adverb) Something that is still happening (still).<br>2. (Adverb) To magnify a comparative word (even bigger).<br><b>Example 1:</b> Are you <b>still</b> studying?<br><b>Example 2:</b> He is <b>even</b> bigger than me.",
            "tl": "<b>Paliwanag:</b><br>1. (Pang-abay) Isang bagay na patuloy na nangyayari (pa rin).<br>2. (Pang-abay) Upang palakihin ang salita sa paghahambing (mas pa).<br><b>Halimbawa 1:</b> Nag-aaral ka <b>pa rin</b> ba?<br><b>Halimbawa 2:</b> Siya ay <b>mas (lalo pang)</b> malaki kaysa sa akin.",
            "fi": "<b>Selitys:</b><br>1. (Adverbi) Jotain, mikä yhä tapahtuu (vielä/yhä).<br>2. (Adverbi) Suurentamaan sanaa vertailussa (vielä isompi).<br><b>Esimerkki 1:</b> Opiskeletko <b>yhä</b>?<br><b>Esimerkki 2:</b> Hän on <b>vielä</b> isompi kuin minä.",
            "fr": "<b>Explication:</b><br>1. (Adverbe) Quelque chose qui se passe encore (encore/toujours).<br>2. (Adverbe) Pour amplifier un mot comparatif (encore plus grand).<br><b>Exemple 1:</b> Es-tu <b>encore</b> en train d'étudier ?<br><b>Exemple 2:</b> Il est <b>encore</b> plus grand que moi.",
            "fo": "<b>Frágreiðing:</b><br>1. (Hjáorð) Okkurt sum framvegis hendir (enn).<br>2. (Hjáorð) Til at forsterka lýsingarorð (enn størri).<br><b>Dømi 1:</b> Ert tú <b>enn</b> at læra?<br><b>Dømi 2:</b> Hann er <b>enn</b> størri enn eg.",
            "kl": "<b>Nassoqqaat:</b><br>1. (Udsagnsord) Suli.<br>2. Suli annerusoq.<br><b>Assersuut 1:</b> <b>Suli</b> atuarit?<br><b>Assersuut 2:</b> Uannit <b>suli</b> angineruvoq.",
            "nl": "<b>Uitleg:</b><br>1. (Bijwoord) Iets dat nog steeds gebeurt (nog steeds).<br>2. (Bijwoord) Om een vergrotende trap te versterken (nog groter).<br><b>Voorbeeld 1:</b> Ben je <b>nog steeds</b> aan het leren?<br><b>Voorbeeld 2:</b> Hij is <b>nog</b> groter dan ik.",
            "it": "<b>Spiegazione:</b><br>1. (Avverbio) Qualcosa che sta ancora accadendo (ancora).<br>2. (Avverbio) Per amplificare una parola comparativa (ancora più grande).<br><b>Esempio 1:</b> Stai <b>ancora</b> studiando?<br><b>Esempio 2:</b> Lui è <b>ancora</b> più grande di me.",
            "ja": "<b>説明:</b><br>1. (副詞) まだ起こっていること（まだ）。<br>2. (副詞) 比較の言葉を強調するため（さらに大きい）。<br><b>例文 1:</b> あなたは<b>まだ</b>勉強していますか？<br><b>例文 2:</b> 彼は私よりも<b>さらに</b>大きいです。",
            "zh": "<b>解释:</b><br>1. (副词) 仍在发生的事情（还/仍然）。<br>2. (副词) 放大比较级词语（甚至更大）。<br><b>例句 1:</b> 你<b>仍然</b>在学习吗？<br><b>例句 2:</b> 他甚至比我<b>还</b>大。",
            "ku": "<b>Ravekirin:</b><br>1. (Hoker) Tiştek ku hîn jî diqewime (hîn).<br>2. (Hoker) Ji bo xurtkirina peyveke berawirdî (hê meztir).<br><b>Mînak 1:</b> Tu <b>hîn</b> dixwînî?<br><b>Mînak 2:</b> Ew ji min <b>hê</b> meztir e.",
            "lv": "<b>Paskaidrojums:</b><br>1. (Apstākļa vārds) Kaut kas, kas joprojām notiek (vēl/aizvien).<br>2. (Apstākļa vārds) Lai palielinātu vārda nozīmi salīdzinājumā (vēl lielāks).<br><b>Piemērs 1:</b> Vai tu <b>joprojām</b> mācies?<br><b>Piemērs 2:</b> Viņš ir <b>vēl</b> lielāks par mani.",
            "lt": "<b>Paaiškinimas:</b><br>1. (Prievezmis) Kažkas, kas vis dar vyksta (vis dar).<br>2. (Prievezmis) Sustiprinti lyginamąjį žodį (dar didesnis).<br><b>Pavyzdys 1:</b> Ar tu <b>vis dar</b> mokaisi?<br><b>Pavyzdys 2:</b> Jis yra <b>dar</b> didesnis už mane.",
            "no": "<b>Forklaring:</b><br>1. (Adverb) Noe som fremdeles skjer (ennå/fremdeles).<br>2. (Adverb) For å forsterke et komparativt ord (enda større).<br><b>Eksempel 1:</b> Studerer du <b>fremdeles</b>?<br><b>Eksempel 2:</b> Han er <b>enda</b> større enn meg.",
            "fa": "<div dir='rtl'><b>توضیح:</b><br>1. (قید) چیزی که هنوز در حال رخ دادن است (هنوز).<br>2. (قید) برای تشدید یک کلمه تفضیلی در مقایسه (حتی بزرگتر).<br><b>مثال 1:</b> آیا <b>هنوز</b> در حال یادگیری هستی؟<br><b>مثال 2:</b> او <b>حتی (بیشتر)</b> بزرگتر از من است.</div>",
            "pt": "<b>Explicação:</b><br>1. (Advérbio) Algo que ainda está acontecendo (ainda).<br>2. (Advérbio) Para ampliar uma palavra comparativa (ainda maior).<br><b>Exemplo 1:</b> Você <b>ainda</b> está estudando?<br><b>Exemplo 2:</b> Ele é <b>ainda</b> maior do que eu.",
            "pl": "<b>Wyjaśnienie:</b><br>1. (Przysłówek) Coś, co wciąż się dzieje (nadal/wciąż).<br>2. (Przysłówek) Aby wzmocnić słowo w stopniu wyższym (jeszcze większy).<br><b>Przykład 1:</b> Czy <b>nadal</b> się uczysz?<br><b>Przykład 2:</b> On jest <b>jeszcze</b> większy ode mnie.",
            "ro": "<b>Explicație:</b><br>1. (Adverb) Ceva care se întâmplă încă (încă/mai).<br>2. (Adverb) Pentru a amplifica un cuvânt comparativ (și mai mare).<br><b>Exemplu 1:</b> <b>Încă</b> mai înveți?<br><b>Exemplu 2:</b> El este <b>și mai</b> mare decât mine.",
            "ru": "<b>Объяснение:</b><br>1. (Наречие) То, что все еще происходит (еще/все еще).<br>2. (Наречие) Для усиления сравнительного слова (еще больше).<br><b>Пример 1:</b> Ты <b>все еще</b> учишься?<br><b>Пример 2:</b> Он <b>еще</b> больше меня.",
            "es": "<b>Explicación:</b><br>1. (Adverbio) Algo que todavía está sucediendo (aún/todavía).<br>2. (Adverbio) Para amplificar una palabra comparativa (aún más grande).<br><b>Ejemplo 1:</b> ¿<b>Todavía</b> estás estudiando?<br><b>Ejemplo 2:</b> Él es <b>aún</b> más grande que yo.",
            "sv": "<b>Förklaring:</b><br>1. (Adverb) Något som fortfarande händer (ännu/fortfarande).<br>2. (Adverb) För att förstärka ett komparativt ord (ännu större).<br><b>Exempel 1:</b> Pluggar du <b>fortfarande</b>?<br><b>Exempel 2:</b> Han är <b>ännu</b> större än jag.",
            "th": "<b>คำอธิบาย:</b><br>1. (คำกริยาวิเศษณ์) สิ่งที่ยังคงเกิดขึ้น (ยังคง)<br>2. (คำกริยาวิเศษณ์) เพื่อขยายคำในการเปรียบเทียบ (ยิ่งกว่า)<br><b>ตัวอย่าง 1:</b> คุณ<b>ยังคง</b>เรียนอยู่ไหม?<br><b>ตัวอย่าง 2:</b> เขาตัวใหญ่กว่าฉัน<b>อีก</b>",
            "de": "<b>Erklärung:</b><br>1. (Adverb) Etwas, das immer noch passiert (noch/immer noch).<br>2. (Adverb) Um ein Vergleichswort zu verstärken (noch größer).<br><b>Beispiel 1:</b> Lernst du <b>immer noch</b>?<br><b>Beispiel 2:</b> Er ist <b>noch</b> größer als ich.",
            "uk": "<b>Пояснення:</b><br>1. (Прислівник) Те, що все ще відбувається (ще/досі).<br>2. (Прислівник) Для підсилення порівняльного слова (ще більший).<br><b>Приклад 1:</b> Ти <b>досі</b> вчишся?<br><b>Приклад 2:</b> Він <b>ще</b> більший за мене.",
            "vi": "<b>Giải thích:</b><br>1. (Trạng từ) Điều gì đó vẫn đang xảy ra (vẫn).<br>2. (Trạng từ) Để phóng đại một từ so sánh (thậm chí lớn hơn).<br><b>Ví dụ 1:</b> Bạn <b>vẫn</b> đang học à?<br><b>Ví dụ 2:</b> Anh ấy <b>thậm chí (còn)</b> lớn hơn tôi."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð: 131 - 140 algengustu orðin í íslenskum námsbókum</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="" selected disabled>Veldu tungumál...</option>
                <option value="ar">Arabíska – العربية</option>
                <option value="be">Belgíska (Flæmska) – Vlaams</option>
                <option value="da">Danska – Dansk</option>
                <option value="en">Enska – English</option>
                <option value="tl">Filippseyska – Tagalog</option>
                <option value="fi">Finnska – Suomi</option>
                <option value="fr">Franska – Français</option>
                <option value="fo">Færeyska – Føroyskt</option>
                <option value="kl">Grænlenska – Kalaallisut</option>
                <option value="nl">Hollenska – Nederlands</option>
                <option value="it">Ítalska – Italiano</option>
                <option value="ja">Japanska – 日本語</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="ku">Kúrdíska – Kurdî</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="de">Þýska – Deutsch</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
        <div class="feedback-note">
            Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : '';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af${exerciseData.length}`;
    
    if (!selectedLang) {
        document.getElementById('media-box').innerHTML = "<i>Veldu tungumál úr listanum að ofan til að sjá þýðingu.</i>";
    } else {
        document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";
    }

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 131 - 140 algengustu orðin í íslenskum námsbókum', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
